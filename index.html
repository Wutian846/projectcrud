<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Chi - Thu - Góp vốn | Lamtoan138</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            updateDoc, 
            deleteDoc, 
            doc, 
            onSnapshot, 
            query, 
            orderBy 
        } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAejyPG-xi_cZnPuMYUJMeR916Ox_BNSiY",
            authDomain: "wtver-f831b.firebaseapp.com",
            projectId: "wtver-f831b",
            storageBucket: "wtver-f831b.firebasestorage.app",
            messagingSenderId: "210899208439",
            appId: "1:210899208439:web:4c0f046b0c05f700b4ebf2",
            measurementId: "G-1H7BPL0LC3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Export Firebase functions globally
        window.firebaseDB = db;
        window.firebaseCollection = collection;
        window.firebaseAddDoc = addDoc;
        window.firebaseUpdateDoc = updateDoc;
        window.firebaseDeleteDoc = deleteDoc;
        window.firebaseDoc = doc;
        window.firebaseOnSnapshot = onSnapshot;
        window.firebaseQuery = query;
        window.firebaseOrderBy = orderBy;

        console.log("✅ Firebase connected with new config");
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', system_ui, sans-serif; }
        table { border-collapse: collapse; }
        th, td { border: 1px solid #e5e7eb; padding: 12px 16px; text-align: left; }
        th { background-color: #f8fafc; font-weight: 600; color: #334155; }
        tr:nth-child(even) { background-color: #f8fafc; }
        .total-row { font-weight: 700; background-color: #e0f2fe !important; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <!-- LOGIN -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-600 to-indigo-700">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md p-8">
            <div class="flex flex-col items-center mb-8">
                <div class="w-16 h-16 bg-blue-100 rounded-2xl flex items-center justify-center text-4xl mb-4">💰</div>
                <h1 class="text-3xl font-semibold text-slate-900">Quản lý Tài chính</h1>
                <p class="text-slate-500 mt-2">Lamtoan138 <span class="text-emerald-500">(Cloud Sync)</span></p>
            </div>
            
            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">ID</label>
                    <input id="login-id" type="text" value="Lamtoan138" class="w-full px-4 py-3 border border-slate-300 rounded-2xl focus:outline-none focus:border-blue-500 text-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Mật khẩu</label>
                    <input id="login-pass" type="password" class="w-full px-4 py-3 border border-slate-300 rounded-2xl focus:outline-none focus:border-blue-500 text-lg">
                </div>
                
                <button id="login-btn" class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-lg rounded-3xl">
                    Đăng nhập
                </button>
                
                <p id="login-error" class="text-red-500 text-center text-sm hidden">ID hoặc mật khẩu không đúng!</p>
            </div>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="main-screen" class="hidden min-h-screen">
        <div class="bg-white border-b sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
                <div class="flex items-center gap-x-3">
                    <div class="text-3xl">💰</div>
                    <div>
                        <h1 class="text-2xl font-semibold">Quản lý Chi - Thu - Góp vốn</h1>
                        <p class="text-emerald-600 text-sm">Đang đồng bộ Cloud Realtime</p>
                    </div>
                </div>
                <div class="flex items-center gap-x-4">
                    <input id="month-picker" type="month" class="bg-slate-100 px-4 py-2 rounded-3xl font-medium">
                    <button id="logout-btn" class="px-6 py-2 text-sm font-medium text-slate-500 hover:text-slate-700">Đăng xuất</button>
                </div>
            </div>
        </div>

        <div class="max-w-9xl mx-auto px-8 py-8">
            <!-- Add Form -->
            <div class="bg-white rounded-3xl shadow p-6 mb-8">
                <h2 class="text-xl font-semibold mb-6">📌 Thêm giao dịch mới</h2>
                <form id="entry-form" class="grid grid-cols-2 md:grid-cols-7 gap-6">
                    <div class="md:col-span-1">
                        <label class="block text-xs font-medium text-slate-500 mb-1">NGÀY</label>
                        <input id="input-date" type="date" class="w-full px-4 py-3 border border-slate-300 rounded-2xl">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">CHI TIẾT</label>
                        <input id="input-chi-tiet-chi" type="text" placeholder="Mô tả khoản chi" class="w-full px-4 py-3 border border-slate-300 rounded-2xl">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">KHOẢN CHI</label>
                        <input id="input-khoan-chi" type="number" step="1000" placeholder="0" class="w-full px-4 py-3 border border-slate-300 rounded-2xl text-right">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">CHI TIẾT</label>
                        <input id="input-chi-tiet-thu" type="text" placeholder="Mô tả khoản thu" class="w-full px-4 py-3 border border-slate-300 rounded-2xl">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">KHOẢN THU</label>
                        <input id="input-khoan-thu" type="number" step="1000" placeholder="0" class="w-full px-4 py-3 border border-slate-300 rounded-2xl text-right">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">GÓP VỐN</label>
                        <input id="input-gop-von" type="number" step="1000" placeholder="0" class="w-full px-4 py-3 border border-slate-300 rounded-2xl text-right">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">CHI TIẾT</label>
                        <input id="input-chi-tiet-gop" type="text" placeholder="Mô tả góp vốn" class="w-full px-4 py-3 border border-slate-300 rounded-2xl">
                    </div>

                    <div class="md:col-span-7 flex justify-end gap-3">
                        <button type="button" id="clear-btn" class="px-8 py-3 text-slate-500 hover:bg-slate-100 rounded-3xl">Xóa form</button>
                        <button type="submit" class="px-10 py-3 bg-emerald-600 text-white font-semibold rounded-3xl">💾 Lưu giao dịch</button>
                    </div>
                </form>
            </div>

            <!-- Table -->
            <div class="bg-white rounded-3xl shadow overflow-hidden">
                <div class="px-10 py-4 border-b flex justify-between bg-slate-50">
                    <h2 class="font-semibold text-lg">Bảng giao dịch</h2>
                    <div>
                        <button id="export-btn" class="bg-blue-600 text-white px-6 py-2 rounded-3xl mr-3">📤 Xuất Excel</button>
                        <button id="delete-all-btn" class="text-red-600 px-6 py-2 rounded-3xl">🗑️ Xóa tất cả</button>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm" id="data-table">
                        <thead>
                            <tr>
                                <th class="w-12">STT</th>
                                <th class="w-28">NGÀY</th>
                                <th>CHI TIẾT</th>
                                <th class="text-right w-32">KHOẢN CHI</th>
                                <th>CHI TIẾT</th>
                                <th class="text-right w-32">KHOẢN THU</th>
                                <th class="text-right w-32">GÓP VỐN</th>
                                <th>CHI TIẾT</th>
                                <th class="w-24 text-center">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="table-body"></tbody>
                        <tfoot id="table-foot"></tfoot>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let entries = [];
        let currentEditingId = null;
        let unsubscribe = null;

        const PASSWORD = "thienphuc09@";
        const USER_ID = "Lamtoan138";

        // Login
        document.getElementById('login-btn').addEventListener('click', () => {
            const id = document.getElementById('login-id').value.trim();
            const pass = document.getElementById('login-pass').value.trim();
            if (id === USER_ID && pass === PASSWORD) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-screen').classList.remove('hidden');
                initDashboard();
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            if (confirm('Đăng xuất?')) location.reload();
        });

        function initDashboard() {
            loadRealtimeData();
            const today = new Date();
            document.getElementById('month-picker').value = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0');
            document.getElementById('input-date').value = today.toISOString().split('T')[0];
        }

        function loadRealtimeData() {
            if (unsubscribe) unsubscribe();

            const colRef = window.firebaseCollection(window.firebaseDB, `finance_${USER_ID}`);
            const q = window.firebaseQuery(colRef, window.firebaseOrderBy("date", "desc"));

            unsubscribe = window.firebaseOnSnapshot(q, (snapshot) => {
                entries = [];
                snapshot.forEach((d) => {
                    entries.push({ id: d.id, ...d.data() });
                });
                renderTable();
            });
        }

        function renderTable() {
            const selectedMonth = document.getElementById('month-picker').value;
            const tbody = document.getElementById('table-body');
            const tfoot = document.getElementById('table-foot');

            tbody.innerHTML = '';
            tfoot.innerHTML = '';

            const filtered = entries.filter(e => e.date && e.date.startsWith(selectedMonth));

            if (filtered.length === 0) return;

            let totalChi = 0, totalThu = 0, totalGop = 0;

            filtered.forEach((entry, i) => {
                const chi = parseFloat(entry.khoanChi) || 0;
                const thu = parseFloat(entry.khoanThu) || 0;
                const gop = parseFloat(entry.gopVon) || 0;
                totalChi += chi; totalThu += thu; totalGop += gop;

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${i+1}</td>
                    <td>${entry.date}</td>
                    <td class="max-w-xs truncate">${entry.chiTietChi || ''}</td>
                    <td class="text-right text-red-600">${chi.toLocaleString('vi-VN')}</td>
                    <td class="max-w-xs truncate">${entry.chiTietThu || ''}</td>
                    <td class="text-right text-emerald-600">${thu.toLocaleString('vi-VN')}</td>
                    <td class="text-right text-amber-600">${gop.toLocaleString('vi-VN')}</td>
                    <td class="max-w-xs truncate">${entry.chiTietGop || ''}</td>
                    <td class="text-center">
                        <button onclick="editEntry('${entry.id}')" class="text-blue-600 mx-1">✏️</button>
                        <button onclick="deleteEntry('${entry.id}')" class="text-red-600 mx-1">🗑️</button>
                    </td>
                `;
                tbody.appendChild(row);
            });

            const totalRow = document.createElement('tr');
            totalRow.className = 'total-row';
            totalRow.innerHTML = `
                <td colspan="3" class="text-right font-bold">TỔNG CỘNG</td>
                <td class="text-right font-bold text-red-600">${totalChi.toLocaleString('vi-VN')}</td>
                <td></td>
                <td class="text-right font-bold text-emerald-600">${totalThu.toLocaleString('vi-VN')}</td>
                <td class="text-right font-bold text-amber-600">${totalGop.toLocaleString('vi-VN')}</td>
                <td colspan="2"></td>
            `;
            tfoot.appendChild(totalRow);
        }

        // Submit Form
        document.getElementById('entry-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const date = document.getElementById('input-date').value;
            if (!date) return alert('Vui lòng chọn ngày!');

            const entryData = {
                date: date,
                chiTietChi: document.getElementById('input-chi-tiet-chi').value.trim(),
                khoanChi: parseFloat(document.getElementById('input-khoan-chi').value) || 0,
                chiTietThu: document.getElementById('input-chi-tiet-thu').value.trim(),
                khoanThu: parseFloat(document.getElementById('input-khoan-thu').value) || 0,
                gopVon: parseFloat(document.getElementById('input-gop-von').value) || 0,
                chiTietGop: document.getElementById('input-chi-tiet-gop').value.trim(),
                timestamp: new Date().toISOString()
            };

            try {
                if (currentEditingId) {
                    await window.firebaseUpdateDoc(window.firebaseDoc(window.firebaseDB, `finance_${USER_ID}`, currentEditingId), entryData);
                } else {
                    await window.firebaseAddDoc(window.firebaseCollection(window.firebaseDB, `finance_${USER_ID}`), entryData);
                }
                clearForm();
                showToast('✅ Đã lưu vào Cloud!');
            } catch (error) {
                console.error(error);
                alert('Lỗi khi lưu dữ liệu!');
            }
        });

        function clearForm() {
            document.getElementById('entry-form').reset();
            currentEditingId = null;
            document.getElementById('input-date').value = new Date().toISOString().split('T')[0];
        }

        window.editEntry = (id) => {
            const entry = entries.find(e => e.id === id);
            if (!entry) return;
            currentEditingId = id;
            document.getElementById('input-date').value = entry.date;
            document.getElementById('input-chi-tiet-chi').value = entry.chiTietChi || '';
            document.getElementById('input-khoan-chi').value = entry.khoanChi || '';
            document.getElementById('input-chi-tiet-thu').value = entry.chiTietThu || '';
            document.getElementById('input-khoan-thu').value = entry.khoanThu || '';
            document.getElementById('input-gop-von').value = entry.gopVon || '';
            document.getElementById('input-chi-tiet-gop').value = entry.chiTietGop || '';
        };

        window.deleteEntry = async (id) => {
            if (confirm('Xóa giao dịch này?')) {
                try {
                    await window.firebaseDeleteDoc(window.firebaseDoc(window.firebaseDB, `finance_${USER_ID}`, id));
                } catch (e) {
                    alert('Lỗi khi xóa!');
                }
            }
        };

        document.getElementById('clear-btn').addEventListener('click', clearForm);

        // Export to CSV
        document.getElementById('export-btn').addEventListener('click', () => {
            const selectedMonth = document.getElementById('month-picker').value;
            const filtered = entries.filter(e => e.date && e.date.startsWith(selectedMonth));
            if (filtered.length === 0) return alert('Không có dữ liệu!');

            let csv = "\uFEFFSTT,Ngày,CHI TIẾT (Chi),KHOẢN CHI,CHI TIẾT (Thu),KHOẢN THU,GÓP VỐN,CHI TIẾT (Góp)\n";
            let tChi=0, tThu=0, tGop=0;

            filtered.forEach((e,i) => {
                const chi = parseFloat(e.khoanChi)||0;
                const thu = parseFloat(e.khoanThu)||0;
                const gop = parseFloat(e.gopVon)||0;
                tChi+=chi; tThu+=thu; tGop+=gop;
                csv += `${i+1},${e.date},"${(e.chiTietChi||"").replace(/"/g,'""')}","${chi}","${(e.chiTietThu||"").replace(/"/g,'""')}","${thu}","${gop}","${(e.chiTietGop||"").replace(/"/g,'""')}"\n`;
            });

            csv += `TỔNG,,,${tChi},,,${tThu},${tGop},,\n`;

            const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `TaiChinh_${selectedMonth}_Lamtoan138.csv`;
            link.click();
            showToast('📤 Đã xuất file Excel');
        });

        function showToast(msg) {
            const t = document.createElement('div');
            t.style.cssText = 'position:fixed;bottom:20px;right:20px;background:#10b981;color:white;padding:14px 24px;border-radius:9999px;z-index:9999;';
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }
    </script>
</body>
</html>
